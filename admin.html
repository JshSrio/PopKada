<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PopKada — Staff Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-admin">

  <!-- ============ DASHBOARD ============
       No login gate: this page isn't linked from the customer-facing site,
       so access is controlled by keeping the URL private to staff. If that
       ever changes (e.g. it gets indexed or shared more widely), add real
       auth — server-side sessions or Firebase Auth — before relying on
       "nobody has the link" as the only protection.
  -->
  <div class="admin-dash" id="adminDash">

    <header class="admin-dash__bar">
      <div class="admin-dash__brand">
        <img src="popkada-logo.png" alt="PopKada">
        <span>Staff Dashboard</span>
      </div>
    </header>

    <section class="stat-strip">
      <div class="stat-card">
        <span class="stat-card__value" id="statTotal">0</span>
        <span class="stat-card__label">Total responses</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value" id="statAverage">–</span>
        <span class="stat-card__label">Average rating</span>
        <div class="stat-card__stars" id="statAverageStars" aria-hidden="true"></div>
      </div>
      <div class="stat-card">
        <span class="stat-card__value" id="statWeek">0</span>
        <span class="stat-card__label">Last 7 days</span>
      </div>
      <div class="stat-card stat-card--dist">
        <span class="stat-card__label">Rating spread</span>
        <div class="dist-bars" id="distBars">
          <!-- 5 rows built by JS: label, bar, count -->
        </div>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar__group">
        <label for="filterRating">Rating</label>
        <select id="filterRating">
          <option value="all">All ratings</option>
          <option value="5">★★★★★ only</option>
          <option value="4">★★★★ only</option>
          <option value="3">★★★ only</option>
          <option value="2">★★ only</option>
          <option value="1">★ only</option>
        </select>
      </div>
      <div class="toolbar__group">
        <label for="filterStatus">Status</label>
        <select id="filterStatus">
          <option value="all">All statuses</option>
          <option value="new">New</option>
          <option value="read">Read</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
      <div class="toolbar__group">
        <label for="sortBy">Sort by</label>
        <select id="sortBy">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="highest">Highest rating</option>
          <option value="lowest">Lowest rating</option>
        </select>
      </div>
      <button type="button" class="btn btn--secondary btn--small" id="exportBtn">Export CSV</button>
    </section>

    <section class="feedback-list" id="feedbackList" aria-live="polite">
      <!-- feedback entries injected by JS -->
    </section>

    <p class="empty-state" id="emptyState" hidden>No feedback here yet — once customers scan the QR code and send a response, it'll show up in this list.</p>

  </div>

  <!-- ============ STORY CARD MODAL ============
       Renders a single feedback entry as a vertical (1080x1920 / 9:16) card
       on a <canvas>, sized for Instagram/Facebook Stories, with a button to
       download it as a PNG staff can post directly.
  -->
  <div class="story-modal" id="storyModal" hidden>
    <div class="story-modal__backdrop" id="storyBackdrop"></div>
    <div class="story-modal__panel">
      <canvas id="storyCanvas" width="1080" height="1920"></canvas>
      <div class="story-modal__actions">
        <button type="button" class="btn btn--primary" id="storyDownloadBtn">Download for Stories</button>
        <button type="button" class="btn btn--ghost" id="storyCloseBtn">Close</button>
      </div>
    </div>
  </div>

  <script src="logo-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
